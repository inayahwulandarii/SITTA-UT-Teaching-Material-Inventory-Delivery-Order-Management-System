<!doctype html>
<html>
  <head>
    <style>
    /* VIDEO BACKGROUND */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: -1;

      filter: brightness(55%);
    }
  </style>
  <body>
    <!-- VIDEO BACKGROUND -->
    <video autoplay muted loop playsinline id="bgVideo">
      <source src="video/background.mp4" type="video/mp4" />
    </video>
    
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="tracking" class="wrap">
      <h2>Tracking DO</h2>
      <input v-model="nim" placeholder="NIM" />
      <input v-model="nama" placeholder="Nama" />
      <select v-model="paketDipilih">
        <option :value="null">Pilih Paket</option>
        <option v-for="p in paket" :value="p">{{p.kode}} - {{p.nama}}</option>
      </select>
      <div v-if="paketDipilih">
        <p>Isi Paket:</p>
        <ul>
          <li v-for="i in paketDipilih.isi">{{i}}</li>
        </ul>
        <p>Total: Rp {{paketDipilih.harga}}</p>
      </div>
      <button @click="generate">Generate DO</button
      ><a href="index.html">
        <button class="btn secondary">Kembali</button>
      </a>
      <h3 v-show="nomor">{{nomor}}</h3>
    </div>
    <script src="js/dataBahanAjar.js"></script>
    <script src="js/tracking-app.js"></script>
  </body>
</html>
