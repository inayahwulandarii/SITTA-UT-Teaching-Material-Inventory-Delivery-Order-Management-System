<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard - SITTA UT</title>
    <link rel="stylesheet" href="css/style1.css" />
  </head>
  <style>
    /* VIDEO BACKGROUND */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: -1;

      filter: brightness(55%);
    }
  </style>
  <body>
    <!-- VIDEO BACKGROUND -->
    <video autoplay muted loop playsinline id="bgVideo">
      <source src="video/background.mp4" type="video/mp4" />
    </video>
    <header class="site-header">
      <div class="container header-inner">
        <img src="assets/img/logo-ut.jpg" alt="Logo UT" style="height: 40px; margin-right: 10px" onerror="this.src = 'assets/img/Default.jpg'" />

        <nav>
          <a href="stok.html" class="btn ghost">Stok Bahan Ajar</a>
          <a href="tracking.html" class="btn ghost">Tracking DO</a>
          <a href="login.html" class="btn ghost">Logout</a>
      
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <h2 id="greeting">Selamat Datang</h2>
        <p id="userInfo" class="small"></p>
          <div class="grid stats">
            <div class="stat">
              <h4 id="stokTotal">-</h4>
              <p>Total Stok Bahan Ajar</p>
            </div>
            <div class="stat">
              <h4 id="inTransit">-</h4>
              <p>Dalam Pengiriman</p>
            </div>
            <div class="stat">
              <h4>3</h4>
              <p>Pesanan Hari Ini (simulasi)</p>
            </div>
          </div>
        </article>
      </section>
    </main>


    <script src="js/data.js"></script>
    <script src="js/session.js"></script>
    <script>
      // Update dashboard statistics
      document.addEventListener('DOMContentLoaded', () => {
        // Update stok total
        const bahanAjar = getDataBahanAjar();
        const totalStok = bahanAjar.reduce((sum, item) => sum + item.stok, 0);
        document.getElementById('stokTotal').textContent = totalStok;

        // Update dalam pengiriman
        const localOrders = JSON.parse(localStorage.getItem('orders')) || [];
        const allTracking = [...dataTracking, ...localOrders];
        const dalamPengiriman = allTracking.filter((i) => i.status === 'Dalam Pengiriman').length;
        document.getElementById('inTransit').textContent = dalamPengiriman;
      });
    </script>
  </body>
</html>
