<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <style>
    /* VIDEO BACKGROUND */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: -1;

      filter: brightness(55%);
    }
  </style>
  <body>
    <!-- VIDEO BACKGROUND -->
    <video autoplay muted loop playsinline id="bgVideo">
      <source src="video/background.mp4" type="video/mp4" />
    </video>
    
      </div>
    </header>
    <div id="app" class="wrap">
      <h2>Stok Bahan Ajar</h2>

      <select v-model="filterUPBJJ">
        <option value="">Semua UT</option>
        <option v-for="u in upbjjList">{{u}}</option>
      </select>

      <select v-if="filterUPBJJ" v-model="filterKategori">
        <option value="">Semua Kategori</option>
        <option v-for="k in kategoriList">{{k}}</option>
      </select>

      <label><input type="checkbox" v-model="reorderOnly" /> Reorder</label>

      <select v-model="sortBy">
        <option value="">Sort</option>
        <option value="judul">Judul</option>
        <option value="qty">Stok</option>
        <option value="harga">Harga</option>
      </select>

      <button @click="resetFilter">Reset</button>

      <table>
        <tr>
          <th>Kode</th>
          <th>Judul</th>
          <th>Qty</th>
          <th>Status</th>
        </tr>
        <tr v-for="x in hasil">
          <td>{{x.kode}}</td>
          <td>{{x.judul}}</td>
          <td><input type="number" v-model.number="x.qty" /></td>
          <td>
            <span v-if="x.qty===0" class="red">Kosong</span>
            <span v-else-if="x.qty<x.safety" class="orange">Menipis</span>
            <span v-else class="green">Aman</span>
          </td>
        </tr>
      </table>

      <h3>Tambah Data</h3>
      <input v-model="baru.kode" placeholder="Kode" />
      <input v-model="baru.judul" placeholder="Judul" />
      <button @click="tambah">Tambah</button><a href="index.html">
  <button class="btn secondary">Kembali</button>
</a>
      <p>{{pesan}}</p>
    </div>
    <script src="js/dataBahanAjar.js"></script>
    <script src="js/stok-app.js"></script>
  </body>
</html>
