<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;

        display: flex;
        justify-content: center;
        align-items: center;

        height: 100vh;
        overflow: hidden;
      }

      /* VIDEO BACKGROUND */
      #bgVideo {
        position: fixed;
        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;

        z-index: -1;

        filter: brightness(55%);
      }

      /* FORM LOGIN */
      .container {
        background: rgba(191, 140, 140, 0.288);
        color: rgb(228, 219, 219);
        backdrop-filter: blur(3px);

        padding: 30px;

        border-radius: 12px;

        width: 350px;

        box-shadow: 0 0 15px rgba(10, 0, 0, 0.794);
      }

      h2 {
        text-align: center;
      }

      input {
        width: 93%;
        padding: 10px;
        margin: 8px 0;
      }

      button {
        width: 100%;
        padding: 10px;

        background: #8a0909;

        color: white;

        border: none;

        cursor: pointer;

        border-radius: 5px;
      }

      button:hover {
        background: #e8e7e6d6;
      }

      .link {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-top: 10px;
      }

      .link a {
        color: rgb(228, 219, 219);
        cursor: pointer;
      }

      .modal {
        display: none;

        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background: rgba(0, 0, 0, 0.5);
      }

      .modal-content {
        background: white;

        width: 300px;

        margin: 10% auto;

        padding: 20px;

        border-radius: 10px;
      }

      .close {
        float: right;

        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <!-- VIDEO BACKGROUND -->
    <video autoplay muted loop playsinline id="bgVideo">
      <source src="video/background.mp4" type="video/mp4" />
    </video>

    <div class="container">
      <h2>LOGIN</h2>

      <input type="email" id="email" placeholder="Masukkan Email" />

      <input type="password" id="password" placeholder="Masukkan Password" />

      <button onclick="login()">Login</button>

      <div class="link">
        <a onclick="bukaModal('lupaModal')"> Lupa Password </a>
      </div>
    </div>

    <!-- MODAL LUPA -->
    <div class="modal" id="lupaModal">
      <div class="modal-content">
        <span class="close" onclick="tutupModal('lupaModal')"> × </span>

        <h3>Lupa Password</h3>

        <p>Silakan hubungi admin atau reset password.</p>
      </div>
    </div>

    <!-- MODAL DAFTAR -->
    <div class="modal" id="daftarModal">
      <div class="modal-content">
        <span class="close" onclick="tutupModal('daftarModal')"> × </span>

        <h3>Daftar Akun</h3>

        <input type="text" placeholder="Nama" />

        <input type="email" placeholder="Email" />

        <input type="password" placeholder="Password" />

        <button>Daftar</button>
      </div>
    </div>

    <script>
      function login() {
        let email = document.getElementById('email').value.trim();

        let password = document.getElementById('password').value.trim();

        if (email === 'admin@gmail.com' && password === '12345') {
          const user = {
            name: 'Admin',
            role: 'Mahasiswa',
            lokasi: 'Palembang',
          };

          localStorage.setItem('activeUser', JSON.stringify(user));

          window.location.href = 'index.html';
        } else {
          alert('Email / Password salah');
        }
      }
    </script>
  </body>
</html>
